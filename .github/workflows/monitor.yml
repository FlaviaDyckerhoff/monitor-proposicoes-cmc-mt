name: Monitor Proposições CMC-MT

env:
  TZ: America/Sao_Paulo

on:
  workflow_dispatch:
    inputs:
      max_novidades_email:
        description: "Limite máximo de novidades no email desta execução manual"
        required: false
        default: "80"

jobs:
  monitorar:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar dependências
        run: npm install

      - name: Executar monitor
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          CONTROLE03_API_USER: ${{ secrets.CONTROLE03_API_USER }}
          CONTROLE03_API_PASS: ${{ secrets.CONTROLE03_API_PASS }}
          CONTROLE03_STATE_URL: ${{ secrets.CONTROLE03_STATE_URL }}
          MAX_NOVIDADES_EMAIL: ${{ github.event.inputs.max_novidades_email || '80' }}
        run: |
          set +e
          for tentativa in 1 2 3; do
            node monitor.js
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 75 ]; then
              exit "$status"
            fi
            if [ "$tentativa" -lt 3 ]; then
              espera=$((tentativa * 600))
              echo "Fonte instável. Retry $((tentativa + 1))/3 em $((espera / 60)) minuto(s)."
              sleep "$espera"
            fi
          done
          exit "$status"

      - name: Salvar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f estado.json ]; then
            echo '{"proposicoes_vistas":[],"ultima_execucao":""}' > estado.json
          fi
          git add estado.json
          git diff --staged --quiet || git commit -m "chore: atualiza estado [skip ci]"
          git push
